<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BankWebApp | App</title>
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/transactions.css">
</head>
<body>
<header class="header opacity-zero">
    <div class="logo">
        <a href="page-bank.html">
            <img alt="bank-logo" src="assets/img/bank-logo.png"/>
            <p>Web Bank</p>
        </a>
    </div>

    <div class="button logout-btn">
        <button>
            Log Out
        </button>
        <img src="assets/img/log-out-arrow.png">
    </div>
</header>

<main class="main">
    <form class="auth-form login opacity-zero">
        <p>Log in</p>
        <input
                type="text"
                placeholder="user"
                class="login__input--user"
        />
        <input
                type="password"
                placeholder="PIN"
                maxlength="4"
                class="login__input--pin"
        />
        <button class="login-btn">Continue</button>
        <p class="auth-link signup-link">Sign up.</p>
    </form>

    <form class="auth-form signup opacity-zero">
        <p>Sign up</p>
        <input
                type="text"
                placeholder="Full Name"
                class="signup__input--fullname"
        />
        <input
                type="password"
                placeholder="PIN"
                maxlength="4"
                class="signup__input--pin"
        />
        <button class="signup-btn">Continue</button>
        <p class="auth-link login-link">Log in.</p>
    </form>

    <section class="transactions opacity-zero z-index-min">
        <div id="modalOverlay" class="modal-overlay opacity-zero z-index-min">
            <div class="card-form-modal-container">
                <div class="card-form-img">
                    <img src="assets/img/card-template.png">
                </div>
                <div>
                    <form id="cardForm" class="card-form-container">
                        <label for="cardHolder" class="card-form-label">Cardholber</label>
                        <input type="text" id="cardHolder" class="form-input" placeholder="Cardholber"
                               required>

                        <label for="cardNumber" class="card-form-label">Card Number</label>
                        <input type="text" id="cardNumber" class="form-input" maxlength="19"
                               placeholder="Card Number" required>

                        <span>
                                <div>
                                    <label for="cvv" class="card-form-label">CVV</label>
                            <input type="text" id="cvv" class="form-input" maxlength="3" placeholder="CVV"
                                   required>
                                </div>

                                <div>
                                     <label for="expiryDate" class="card-form-label">Exp Date</label>
                            <input type="text" id="expiryDate" class="form-input" maxlength="5" placeholder="MM/YY"
                                   required>
                                </div>
                            </span>

                        <button class="card-form-button">Add card</button>
                    </form>
                </div>
                <button class="card-form-close-button">✖</button>
            </div>
        </div>
        <div class="transactions-header">
            <div class="transactions-header-welcome-timer">

            </div>
            <div class="transactions-header-date">

            </div>
        </div>
        <div class="transactions-wrapper">


            <!-- MOVEMENTS -->
            <div class="transactions-movements-wrapper">
                <div class="transactions-movements movements">
                    <div class="movements__row">
                        <div class="movements__type movements__type--deposit">2 deposit</div>
                        <div class="movements__date">3 days ago</div>
                        <div class="movements__value">4 000€</div>
                    </div>
                    <div class="movements__row">
                        <div class="movements__type movements__type--withdrawal">
                            1 withdrawal
                        </div>
                        <div class="movements__date">24/01/2037</div>
                        <div class="movements__value">-378€</div>
                    </div>
                </div>
            </div>

            <div class="transactions-cards-operations">
                <div class="transactions-cards">
                    <div class="cards-carousel-container">
                        <div class="cards-carousel-wrapper" style="transform: translateX(0%);">
                        </div>
                        <button class="cards-carousel-arrow left opacity-zero z-index-min" onclick="moveSlide(-1)">
                            &#10094;
                        </button>
                        <button class="cards-carousel-arrow right opacity-zero z-index-min" onclick="moveSlide(1)">
                            &#10095;
                        </button>
                    </div>

                </div>

                <!-- OPERATION: TRANSFERS -->
                <div class="operation operation--transfer">
                    <h2>Transfer money</h2>
                    <form class="form form--transfer">
                        <input type="text" class="form-input form__input--to" placeholder="Transfer to"/>
                        <input type="number" class="form-input form__input--amount" placeholder="Amount"/>
                        <button class="form__btn form__btn--transfer">&rarr;</button>
                    </form>
                </div>

                <!-- OPERATION: CLOSE -->
                <div class="operation operation--close">
                    <h2>Close account</h2>
                    <form class="form form--close">
                        <input type="text" class="form-input form__input--user" placeholder="Confirm user"/>
                        <input
                                type="password"
                                maxlength="6"
                                class="form-input form__input--pin"
                                placeholder="Confirm PIN"
                        />
                        <button class="form__btn form__btn--close">&rarr;</button>
                    </form>
                </div>
            </div>
        </div>


    </section>
</main>
<script src="js/index.js"></script>
</body>
</html>
