<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BankWebApp | App</title>
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/transactions.css">
</head>
<body>
<header class="header opacity-zero">
    <div class="logo">
        <a href="page-bank.html">
            <img alt="bank-logo" src="assets/img/bank-logo.png"/>
            <p>Web Bank</p>
        </a>
    </div>

    <div class="button logout-btn">
        <button>
            Log Out
        </button>
        <img src="assets/img/log-out-arrow.png">
    </div>
</header>

<main class="main">
    <form class="auth-form login opacity-zero">
        <p>Log in</p>
        <input
                type="text"
                placeholder="user"
                class="login__input--user"
        />
        <input
                type="password"
                placeholder="PIN"
                maxlength="4"
                class="login__input--pin"
        />
        <button class="login-btn">Continue</button>
        <p class="auth-link signup-link">Sign up.</p>
    </form>

    <form class="auth-form signup opacity-zero">
        <p>Sign up</p>
        <input
                type="text"
                placeholder="Full Name"
                class="signup__input--fullname"
        />
        <input
                type="password"
                placeholder="PIN"
                maxlength="4"
                class="signup__input--pin"
        />
        <button class="signup-btn">Continue</button>
        <p class="auth-link login-link">Log in.</p>
    </form>

    <section class="transactions ">
        <div class="transactions-header">

        </div>
        <div class="transactions-cards">
            <div class="cards-carousel-container">
                <div class="cards-carousel-wrapper">
                </div>
                <button class="cards-carousel-arrow left" onclick="moveSlide(-1)">&#10094;</button>
                <button class="cards-carousel-arrow right" onclick="moveSlide(1)">&#10095;</button>
            </div>

        </div>
        <div id="modalOverlay" class="modal-overlay opacity-zero z-index-min">
            <div class="card-form-modal-container">
                <div class="card-form-img">
                    <img src="assets/img/card-template.png">
                </div>
                <div>
                    <form id="cardForm" class="card-form-container">
                        <label for="cardHolder" class="card-form-label">Cardholber</label>
                        <input type="text" id="cardHolder" class="form-input" placeholder="Cardholber"
                               required>

                        <label for="cardNumber" class="card-form-label">Card Number</label>
                        <input type="text" id="cardNumber" class="form-input" maxlength="16"
                               placeholder="Card Number" required>

                        <span>
                                <div>
                                    <label for="cvv" class="card-form-label">CVV</label>
                            <input type="text" id="cvv" class="form-input" maxlength="3" placeholder="CVV"
                                   required>
                                </div>

                                <div>
                                     <label for="expiryDate" class="card-form-label">Exp Date</label>
                            <input type="text" id="expiryDate" class="form-input" maxlength="5" placeholder="MM/YY"
                                   required>
                                </div>
                            </span>

                        <button class="card-form-button">Add card</button>
                    </form>
                </div>
                <button class="card-form-close-button">✖</button>
            </div>
        </div>

    </section>

</main>
<script src="js/index.js"></script>
</body>
</html>
